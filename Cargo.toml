[package]
name = "bunker"
version = "0.1.2"
edition = "2021"
license = "Apache-2.0"
description = "A lightweight HTTP/HTTPS and DNS proxy"
repository = "https://github.com/wj1918/bunker"
keywords = ["proxy", "http", "https", "dns", "networking"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "bunker"
path = "src/main.rs"

[lib]
name = "bunker"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
bytes = "1"
httparse = "1"
mimalloc = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
flate2 = "1"
chrono = "0.4"
if-addrs = "0.13"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

# io_uring backend dependency — Linux only, and optional: pulled in only when the
# `engine-uring` feature is enabled. The default build links neither this nor the
# engine module, so the shipped binary is unchanged unless a feature is set.
[target.'cfg(target_os = "linux")'.dependencies]
monoio = { version = "0.2", optional = true }

[features]
# Experimental thread-per-core proxy engine (portable tokio backend). Off by
# default: the shipped proxy still uses the hyper path. `engine` alone works on
# all platforms incl. Windows.
engine = []
# Adds the Linux io_uring (monoio) backend on top of `engine`. Linux only — do
# not enable on Windows/macOS (monoio has no backend there); use `engine` instead.
engine-uring = ["engine", "dep:monoio"]

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
