[package]
name = "bunker"
version = "0.1.5"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "A lightweight HTTP/HTTPS and DNS proxy"
repository = "https://github.com/wj1918/bunker"
keywords = ["proxy", "http", "https", "dns", "networking"]
categories = ["network-programming", "web-programming"]

[[bin]]
name = "bunker"
path = "src/main.rs"

[lib]
name = "bunker"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
bytes = "1"
httparse = "1"
mimalloc = "0.1"
# OS randomness for DNS transaction IDs.
getrandom = "0.2"
socket2 = { version = "0.6", features = ["all"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
flate2 = "1"
chrono = "0.4"
if-addrs = "0.13"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2"

# io_uring backend dependency — Linux only, and optional: pulled in only when the
# `engine-uring` feature is enabled. The default build links neither this nor the
# engine module, so the shipped binary is unchanged unless a feature is set.
[target.'cfg(target_os = "linux")'.dependencies]
# `sync`: lets a task be woken from another thread. Hostname lookups run on
# the tokio runtime and wake the io_uring worker that asked.
monoio = { version = "0.2", optional = true, features = ["sync"] }

[features]
# The proxy is the thread-per-core engine, always, on the portable tokio
# backend. `engine` no longer switches anything: it used to select the engine
# over an older hyper-based implementation, which has been removed. The name is
# kept (and stays in `default`) so existing build commands keep working.
default = ["engine"]
engine = []
# Adds the Linux io_uring (monoio) backend. Linux only — do not enable on
# Windows/macOS (monoio has no backend there).
engine-uring = ["engine", "dep:monoio"]
